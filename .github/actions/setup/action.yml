# Shared by every job, right after actions/checkout (a local action is read from
# the checked-out code). Actions are pinned to a commit hash, release in the comment.
name: Setup
description: Node at the version in .nvmrc, pnpm at the version in package.json, dependencies from the lockfile

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        # pnpm is not installed yet; its store is cached below instead.
        package-manager-cache: false

    # Installed with npm: only GitHub's own actions are allowed in this repository.
    # The version is package.json's packageManager field (pnpm@x.y.z).
    - name: Install pnpm
      shell: bash
      run: npm install --global "$(node -p "require('./package.json').packageManager")"

    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
