# Continuous integration: two jobs, the second only when the first passes.
#   quality           lint, typecheck, Vitest with the coverage floors (no database needed)
#   database-and-e2e  local Supabase in the runner, schema lint, pgTAP, Playwright
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Vitest with coverage: fails when a folder drops below its floor (vitest.config.ts).
      - run: pnpm test:coverage

  database-and-e2e:
    name: Database and end-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Only the services the tests need (no Studio, mail catcher, analytics…): faster startup.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,mailpit,postgres-meta,vector,logflare,supavisor
      - run: pnpm env:local
      - run: pnpm db:lint
      - run: pnpm test:db

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true

      # On failure, keep the Playwright report, traces and screenshots for a week.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
