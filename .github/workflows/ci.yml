# Continuous integration: two jobs, the second only when the first passes.
#   quality           lint, typecheck, Vitest with the coverage floors (no database needed)
#   database-and-e2e  local Supabase in the runner, schema checks, pgTAP, Playwright
#
# Runs on every push to any branch, not only main. A branch reaches main (which
# deploys to production) only through a pull request GitHub merges once these
# two jobs pass: main's ruleset requires them by name, so renaming a job means
# updating the ruleset too (docs/13-deployment.md, 13.8). `pnpm merge:main`
# opens the pull request and waits. The pull request reads this push's results:
# no second run on pull_request.
#
# Third-party actions are pinned to a full commit hash, the release in the comment beside
# it (a tag can be moved, a commit cannot); Dependabot updates both. The setup shared by
# every job (pnpm, Node, dependencies) is .github/actions/setup.
name: CI

on:
  push:
    branches: ['**']

# Read-only token: the jobs only check out the code and run checks.
permissions:
  contents: read

# On a branch, a new push cancels the run still going: only the latest commit matters.
# On main every merge keeps its run, so no commit that reaches production goes unchecked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      # The pushed commit's code; it also holds the local setup action below, so it comes first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm, Node and the dependencies from the lockfile (.github/actions/setup).
      - uses: ./.github/actions/setup
      # ESLint with the stylistic rules, then vue-tsc over app, server and shared code.
      - run: pnpm lint
      - run: pnpm typecheck
      # Vitest with coverage: fails when a folder drops below its floor (vitest.config.ts).
      - run: pnpm test:coverage

  database-and-e2e:
    name: Database and end-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      # Same checkout and setup as the quality job (each job runs on a fresh machine).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The whole local stack in Docker, every migration applied (supabase/migrations), the seed
      # loaded. Only the services the tests need (no Studio, analytics…): faster startup. The mail
      # catcher (Mailpit) stays: password-reset.spec.ts reads the reset email from it.
      # postgres-meta is left out too: `supabase gen types` (db:types:check below) runs
      # its own one-off container; if that step ever fails to connect, start it here instead.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,postgres-meta,vector,logflare,supavisor
      # Writes .env from that stack (Supabase URL and key, its S3 endpoint as the audio storage):
      # the production build the end-to-end tests run reads it.
      - run: pnpm env:local
      # Schema checks, each failing the run: SQL functions' types, Supabase's security and
      # performance advisors, and the committed TypeScript types against the migrations.
      - run: pnpm db:lint
      - run: pnpm db:advisors
      - run: pnpm db:types:check
      # pgTAP (supabase/tests/database): RLS, privileges, sharing functions, caps, storage paths.
      - run: pnpm test:db

      # The browser the tests run, headless Chromium ("--only-shell": they never open the full
      # browser), kept between runs for this Playwright version; the system libraries it needs
      # ("--with-deps") are installed on every run, the machine being new each time.
      # The Playwright version ("Version 1.64.1" → 1.64.1), read only to name the cache below.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # The browsers of a previous run, when that run had the same Playwright: a new version needs
      # its own browser, so it misses the cache, downloads it once, and saves it for the next runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Downloads the browser only when the cache missed; installs the system libraries every time.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      # Playwright on a production build (playwright.config.ts). CI=true: a failed test is retried
      # once, the report is written for GitHub (annotations) and as HTML, and the server is always
      # built fresh instead of reusing one already running.
      - run: pnpm test:e2e
        env:
          CI: true

      # On failure, keep the Playwright report, traces and screenshots for a week.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
