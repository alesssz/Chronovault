# Dependency audit: `pnpm audit` against the advisory database, every week
# and whenever the dependencies change, on any branch. A new advisory fails
# the run, and GitHub emails the repository owner about a failed scheduled run.
#
# Why not GitHub's Dependabot alerts: the dependency graph does not read
# pnpm 12 lockfiles made of two YAML documents (ours: the pnpm version, then
# the packages), so it sees no npm dependency at all and raises no alert.
# pnpm reads its own lockfile. Advisories reviewed and left out, each with
# its reason, are in pnpm-workspace.yaml (auditConfig.ignoreGhsas).
#
# The job summary also lists the outdated packages, to plan updates
# (docs/11-local-development.md, 11.6); that list never fails the run.
#
# The checkout is pinned to a commit hash and the setup is shared: see the top of ci.yml.
name: Audit

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  # Run by hand from the Actions tab.
  workflow_dispatch:
  # A push to any branch that changes the dependencies: branches are merged locally
  # (`make merge`), never through a pull request, and the push to main deploys. Audited
  # on main only, a vulnerable version added on a branch was reported once already in
  # production; now it fails the branch's run, next to its CI, before the merge.
  push:
    branches: ['**']
    paths: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml]
  # A pull request that changes them: none is opened today (see above), but one opened on
  # GitHub, from a fork or by a bot, is audited before it can be merged there.
  pull_request:
    paths: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml]

# Read-only token: the job only reads the code and the advisory database.
permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      # The pushed commit's code; it also holds the local setup action below, so it comes first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm, Node and the dependencies from the lockfile (.github/actions/setup): installed
      # so that `pnpm outdated` compares what is really resolved.
      - uses: ./.github/actions/setup

      - name: Outdated packages (job summary)
        # `pnpm outdated` exits 1 when anything is outdated: informative only.
        run: |
          {
            echo '### Outdated packages'
            echo '```'
            pnpm outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The lockfile against the advisory database, every severity. Advisories already reviewed
      # are left out with their reasons (pnpm-workspace.yaml, auditConfig.ignoreGhsas); any
      # other one fails the run.
      - name: Audit
        run: pnpm audit
