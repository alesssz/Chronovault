# Dependabot: version updates of the GitHub Actions used by the workflows
# and by the shared setup action (checkout, setup-node, pnpm's setup, cache,
# upload-artifact), as one pull request a week. Their CI run is the check.
# The actions are pinned to a commit hash with the release in a comment
# (`@<sha> # v7.0.1`): Dependabot moves both to the new release.
#
# npm packages are left out on purpose: GitHub's dependency graph does not
# read pnpm 12 lockfiles made of two YAML documents (ours), so Dependabot
# would see no package to update. Their security is watched by
# .github/workflows/audit.yml, and updates are made by hand (docs/11-local-development.md, 11.6).
version: 2
updates:
  - package-ecosystem: github-actions
    # `/` alone covers .github/workflows only: the composite actions under
    # .github/actions pin actions too, and each is its own directory.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    groups:
      # Every action's update in a single pull request.
      github-actions:
        patterns: ['*']
