# Dependabot: version updates of the GitHub Actions used by the workflows
# and by the shared setup action (checkout, setup-node, cache, upload-artifact),
# as one pull request a week. Their CI run is the check.
# The actions are pinned to a commit hash with the release in a comment
# (`@<sha> # v7.0.1`): Dependabot moves both to the new release.
#
# npm packages get no version updates here: they are updated by hand. Their
# security updates (a pull request when an alert has a fixed release) are
# turned on in the repository settings, not in this file, and
# .github/workflows/audit.yml checks them on every branch that changes them.
version: 2
updates:
  - package-ecosystem: github-actions
    # `/` alone covers .github/workflows only: the composite actions under
    # .github/actions pin actions too, and each is its own directory.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    groups:
      # Every action's update in a single pull request.
      github-actions:
        patterns: ['*']
