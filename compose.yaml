# Chronovault app container: the whole Nuxt app, pages and API (server/api) in one
# process, as the production build. Supabase (database, auth, storage) runs in its
# own containers managed by the Supabase CLI. Use `pnpm docker` to start both: it
# also writes the .env.docker file this service reads.
# To develop, use `pnpm local` instead: Supabase stays in Docker and Nuxt runs on
# the host with hot reload. This container keeps the build of its last
# `pnpm docker` (`make docker-stop` stops it alone).
name: chronovault

services:
  app:
    build: .
    image: chronovault:local
    ports:
      # Host 8180 (DOCKER_APP_URL in scripts/stack.mjs) → Nuxt's 3000 in the container (Dockerfile).
      - "8180:3000"
    # Written by `pnpm docker`. Optional, so that compose commands that need no
    # app settings (`pnpm stop`, `make docker-logs`) also work for someone who
    # only ever used `pnpm local` and so has no .env.docker.
    env_file:
      - path: .env.docker
        required: false
    extra_hosts:
      # Lets the server reach Supabase on the host through host.docker.internal.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
