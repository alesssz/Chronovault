# pnpm keeps package files in a content-addressable store and hard-links them
# into node_modules. Hard links only work within one drive, so on Windows pnpm
# would otherwise create the store at the root of the project's drive (e.g.
# D:\.pnpm-store). This keeps it inside the project instead (git-ignored).
storeDir: .pnpm-store

# pnpm only runs install scripts of the packages listed here (supply-chain
# protection): these need them to download or build native binaries.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  vue-demi: true

# Peer dependency ranges pnpm should accept although a package does not
# declare them yet.
# - @vercel/analytics 2.0.1 (the latest stable) declares vue-router ^4, while
#   Nuxt 4 brings vue-router 5. The Nuxt entry we use (injectAnalytics) only
#   calls Nuxt's router (useRouter, useRoute, afterEach), unchanged in 5, and
#   Vercel's own 2.1 betas already accept "^4 || ^5". Remove this rule once a
#   stable @vercel/analytics declares vue-router 5.
peerDependencyRules:
  allowedVersions:
    '@vercel/analytics>vue-router': '5'

# Advisories `pnpm audit` (and the weekly audit workflow) leave out: each one
# has no fixed version within reach and cannot be exploited here. None of
# these packages reaches the production build (.output). Check each removal
# condition when the audit runs, and drop the line as soon as it holds.
auditConfig:
  ignoreGhsas:
    # glob 9 to 14.0.1, AbortSignal cancellation bypass (moderate). Fixed in
    # glob 14 only; archiver-utils 5 (glob 10), workbox-build 7 (glob 11),
    # @vercel/nft and js-beautify (glob 13), all at their latest, are build
    # and test tools walking the project's own files with no abort signal.
    # Remove once they move to glob 14.0.2 or later.
    - GHSA-3g3m-2fjr-6pw4
    # minimatch <11.0.1, denial of service through crafted patterns
    # (moderate). Fixed in minimatch 11 only; ESLint, glob, filelist and
    # readdir-glob (lint and build tools) use 5, 9 and 10 with the project's
    # own patterns, never one from a user. Remove once they move to 11.0.1.
    - GHSA-g3hv-75wg-m249
    # deepmerge ≤4.3.1, prototype poisoning of the merged object (low). No
    # patched release exists. Only @rollup/plugin-node-resolve (Nitro's build,
    # at its latest) uses it, merging its own options from the build config.
    # Remove once deepmerge publishes a fix (or the plugin drops it).
    - GHSA-gcqx-w48m-w2h4
    # esbuild <0.28.1, arbitrary file read through esbuild's own dev server
    # on Windows (low). Only fontless (fonts of @nuxt/ui, at build time) uses
    # esbuild here, and only its `transform`, never that server. @nuxt/ui
    # 4.12 still pins @nuxt/fonts 0.14 → fontless 0.2 → esbuild ^0.27.
    # Remove once @nuxt/ui moves to @nuxt/fonts 1.x (fontless 1.x).
    - GHSA-g7r4-m6w7-qqqr
